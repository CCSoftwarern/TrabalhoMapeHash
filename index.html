<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Cadastro de Produtos</h1>

    <form id="produtoForm">
      <div class="form-group">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" required />
      </div>

      <div class="form-group">
        <label for="preco">Preço (R$):</label>
        <input type="number" id="preco" step="0.01" required />
      </div>

      <div class="form-group">
        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" required />
      </div>


      <div class="form-group">
        <label for="descricao">Descrição:</label>
        <textarea id="descricao" rows="3"></textarea>
      </div>

      <button type="submit">Cadastrar Produto no estoque</button>
    </form>

    <h2>Estoque de produtos cadastrados</h2>

    <!-- Campo de busca -->
    <div class="form-group">
      <label for="busca">Buscar Produto:</label>
      <input type="text" id="busca" placeholder="Digite o nome do produto ou ID..." />
    </div>

    <table id="tabelaProdutos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Preço</th>
          <th>Quantidade</th>
          <th>Descrição</th>
          <th>Opções</th>
        </tr>
      </thead>

      <tbody>
        <!-- Produtos serão inseridos aqui -->
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>

</html>
